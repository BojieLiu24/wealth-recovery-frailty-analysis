[project]
name = "wealth-recovery-frailty"
version = "0.1.0"
description = "Reproducible analysis environment for the Wealth Recovery and Frailty project"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "matplotlib>=3.11,<4",
    "numpy>=2.5,<3",
    "openpyxl>=3.1,<4",
    "pandas>=3.0,<4",
    "patsy>=1.0,<2",
    "pyarrow>=25,<26",
    "scipy>=1.18,<2",
    "statsmodels>=0.15,<0.16",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
]

[tool.uv]
package = false
